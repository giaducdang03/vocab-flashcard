services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocabflash
      POSTGRES_PASSWORD: changeme_secret_123
      POSTGRES_DB: vocabflash
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocabflash -d vocabflash"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vocabflash

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://vocabflash:changeme_secret_123@db:5432/vocabflash
      JWT_SECRET: change_me_super_secret_key
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 1440
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vocabflash

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    networks:
      - vocabflash

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "9990:80"
      - "9991:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - vocabflash

volumes:
  pgdata:

networks:
  vocabflash:
    driver: bridge
